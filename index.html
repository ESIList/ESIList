<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>ESIList</title>
        <meta name="description" content="La Demonlist oficial de la ESI, la llamamos ESIList, aunque sea un nombre de amigo y la Escuela Superior de Ingeniería no sea amiga de nadie. Creada por Ninjedu." />

        <!-- Replace your server icon by uploading an image file named "list_icon.png"-->
        <link rel="icon" href="/list_icon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@500;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" type="text/css" href="/css/reset.css" />
        <link rel="stylesheet" type="text/css" href="/css/typography.css" />
        <link rel="stylesheet" type="text/css" href="/css/main.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/list.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/comparator.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/tags.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="/css/pages/leaderboard.css"
        />
        <link rel="stylesheet" type="text/css" href="/css/pages/roulette.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/nav.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/btn.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="/css/components/tabs.css"
        />
        <link rel="stylesheet" type="text/css" href="/css/pages/roulette.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/changelog.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/nav.css" />
        <script src="https://unpkg.com/vue@3.2.31/dist/vue.global.js"></script>
        <script src="https://unpkg.com/vue-router@4.0.14/dist/vue-router.global.prod.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
        <script type="module" src="/js/main.js"></script>
    </head>
    <body id="app">
        <header :class="{ dark: store.dark }" :data-theme="store.theme">
            <div class="logo">
                <h2>ESIList</h2>
                <p>v2.1</p>
            </div>
            <nav class="nav">
                <div class="nav__links">
                    <details class="nav__menu-group" name="site-navigation">
                        <summary
                            class="nav__tab nav__menu-trigger"
                            :class="{ 'router-link-active': ['/', '/runs', '/leaderboard'].includes($route.path) }"
                        >
                            <span class="type-label-lg">List</span>
                            <span class="nav__menu-chevron" aria-hidden="true">▾</span>
                        </summary>
                        <div class="nav__menu-options">
                            <router-link class="nav__menu-item" to="/" @click="$event.currentTarget.closest('details').open = false">
                                <span class="type-label-lg">List</span>
                            </router-link>
                            <router-link class="nav__menu-item" to="/leaderboard" @click="$event.currentTarget.closest('details').open = false">
                                <span class="type-label-lg">Leaderboard</span>
                            </router-link>
                            <router-link class="nav__menu-item" to="/runs" @click="$event.currentTarget.closest('details').open = false">
                                <span class="type-label-lg">Verifications</span>
                            </router-link>
                        </div>
                    </details>
                    <details class="nav__menu-group" name="site-navigation">
                        <summary
                            class="nav__tab nav__menu-trigger"
                            :class="{ 'router-link-active': ['/compare', '/roulette', '/tags'].includes($route.path) || $route.path.startsWith('/tags/') }"
                        >
                            <span class="type-label-lg">Utilities</span>
                            <span class="nav__menu-chevron" aria-hidden="true">▾</span>
                        </summary>
                        <div class="nav__menu-options">
                            <router-link class="nav__menu-item" to="/compare" @click="$event.currentTarget.closest('details').open = false">
                                <span class="type-label-lg">Compare</span>
                            </router-link>
                            <router-link class="nav__menu-item" to="/roulette" @click="$event.currentTarget.closest('details').open = false">
                                <span class="type-label-lg">Roulette</span>
                            </router-link>
                            <router-link class="nav__menu-item" to="/tags" @click="$event.currentTarget.closest('details').open = false">
                                <span class="type-label-lg">Packs</span>
                            </router-link>
                        </div>
                    </details>
                    <router-link class="nav__tab" to="/changelog">
                        <span class="type-label-lg">Changelog</span>
                    </router-link>
                </div>

                <div class="nav__actions">
                    <details class="nav__theme-menu" name="site-navigation">
                        <summary class="nav__icon nav__theme-button" aria-label="Themes" title="Themes">
                            <img :src="store.dark ? '/assets/light.svg' : '/assets/dark.svg'" alt="" />
                            <span class="type-label-lg">Themes</span>
                        </summary>
                        <div class="nav__theme-options" role="group" aria-label="Site themes" :style="{ '--slider-hue': store.customHue }">
                            <button
                                class="nav__theme-mode"
                                type="button"
                                :aria-pressed="store.dark"
                                @click="store.toggleDark()"
                            >
                                <img :src="store.dark ? '/assets/light.svg' : '/assets/dark.svg'" alt="" />
                                {{ store.dark ? 'Switch to light mode' : 'Switch to dark mode' }}
                            </button>
                            <div class="nav__theme-sliders">
                                <label class="nav__theme-slider-label" for="theme-hue">
                                    <span>Color</span>
                                    <output>{{ Math.round(store.customHue) }}°</output>
                                </label>
                                <input
                                    id="theme-hue"
                                    class="nav__theme-slider nav__theme-hue"
                                    type="range"
                                    min="0"
                                    max="360"
                                    step="1"
                                    :value="store.customHue"
                                    :style="{ '--slider-hue': store.customHue }"
                                    aria-label="Theme color"
                                    @input="store.updateCustomTheme('hue', $event.target.value)"
                                />
                                <label class="nav__theme-slider-label" for="theme-shade">
                                    <span>Light to dark</span>
                                    <output>{{ store.customShade }}%</output>
                                </label>
                                <input
                                    id="theme-shade"
                                    class="nav__theme-slider nav__theme-shade"
                                    type="range"
                                    min="0"
                                    max="100"
                                    step="1"
                                    :value="store.customShade"
                                    :style="{ '--slider-hue': store.customHue }"
                                    aria-label="Theme shade from light to dark"
                                    @input="store.updateCustomTheme('shade', $event.target.value)"
                                />
                            </div>
                            <div class="nav__theme-presets">
                                <button
                                    v-for="theme in store.themes"
                                    :key="theme.id"
                                    type="button"
                                    class="nav__theme-option"
                                    :class="{ selected: store.theme === theme.id }"
                                    :aria-pressed="store.theme === theme.id"
                                    @click="store.setTheme(theme.id)"
                                >
                                    <span class="nav__theme-swatch" :class="'swatch-' + theme.id" aria-hidden="true"></span>
                                    {{ theme.name }}
                                </button>
                            </div>
                        </div>
                    </details>
                    <!-- Replace the '#' with your discord server's invite-->
                    <a class="nav__icon" href="https://youtu.be/8IVsNA_o1wE?si=tNU_LWOCUyFKPRho">
                        <img src="/assets/discord.svg" alt="Discord Logo" />
                    </a>
                    <!-- List record submission form, add a link to replace the '#' when putting a link to your list submission form-->
                    <a
                        class="nav__cta type-label-lg"
                        href=https://mail.google.com/mail/?view=cm&fs=1&to=deliriosnocturnosteam@gmail.com
                        target="_blank"
                        >Submit Record</a
                    >
                </div>
            </nav>
        </header>
        <router-view :class="{ dark: store.dark }" :data-theme="store.theme"></router-view>
    </body>
</html>
