name: Update leaderboard snapshots

on:
  push:
    paths:
      - 'data/_list.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leaderboard-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Recalculate today's snapshot
        run: node update-player-graphs.js
      - name: Commit snapshot changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/_point_snapshots.json
          if git diff --cached --quiet; then
            echo "The snapshot is already up to date."
          else
            git commit -m "Update leaderboard snapshot"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
